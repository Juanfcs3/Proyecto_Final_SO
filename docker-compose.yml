name: proyecto-final-so

x-backend: &backend
  build: ./backend
  image: proyecto-final-so-backend:local
  networks:
    - infraestructura

services:
  backend-1:
    <<: *backend
    environment:
      INSTANCE_ID: backend-1

  backend-2:
    <<: *backend
    environment:
      INSTANCE_ID: backend-2

  backend-3:
    <<: *backend
    environment:
      INSTANCE_ID: backend-3

  nginx:
    image: nginx:1.28-alpine
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - infraestructura

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on:
      - nginx
    networks:
      - infraestructura

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    cgroup: host
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker Desktop usa containerd para gestionar las capas con el driver overlayfs.
      - /run/containerd:/run/containerd:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - infraestructura

  prometheus:
    image: prom/prometheus:v3.5.2
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - infraestructura

  grafana:
    image: grafana/grafana:12.4.0
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - infraestructura

networks:
  infraestructura:

volumes:
  prometheus-data:
  grafana-data:
