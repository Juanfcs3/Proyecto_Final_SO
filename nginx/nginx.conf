events {}

http {
    upstream backends {
        zone backends 64k;
        resolver 127.0.0.11 valid=5s;
        server backend-1:8000 resolve;
        server backend-2:8000 resolve;
        server backend-3:8000 resolve;
    }

    server {
        listen 80;

        location = / {
            proxy_pass http://backends;
        }
    }

    server {
        listen 8081;
        access_log off;

        location = /stub_status {
            stub_status;
        }
    }
}
